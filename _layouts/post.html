<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PT Serif', serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .navigation {
            text-align: left;
            margin-bottom: 40px;
            padding-bottom: 20px;
        }

        .back-link {
            color: #0366d6;
            text-decoration: none;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .post-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .post-title {
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .post-author {
            color: #666;
            font-size: 16px;
            margin-bottom: 8px;
            font-variant: small-caps;
        }

        .post-date {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .post-content {
            color: #333;
            font-size: 16px;
            line-height: 1.7;
        }

        .post-content p {
            margin-bottom: 20px;
        }

        .post-content a {
            color: #0366d6;
            text-decoration: none;
        }

        .post-content a:hover {
            text-decoration: underline;
        }

        .post-content ul,
        .post-content ol {
            margin-bottom: 20px;
            padding-left: 20px;
        }

        .post-content li {
            margin-bottom: 10px;
        }

        /* Footnote styling (kramdown output) */
        .post-content sup {
            font-size: 12px;
            line-height: 0;
        }

        .post-content sup a.footnote {
            color: #0366d6;
            text-decoration: none;
        }

        .post-content sup a.footnote:hover {
            text-decoration: underline;
        }

        .footnotes {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
        }

        .footnotes ol {
            padding-left: 20px;
        }

        .footnotes li {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .footnotes li p {
            display: inline;
            margin-bottom: 0;
        }

        .footnotes a {
            color: #0366d6;
            text-decoration: none;
        }

        .footnotes a:hover {
            text-decoration: underline;
        }

        .footnotes a.reversefootnote {
            margin-left: 4px;
        }

        .references {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
            font-size: 14px;
            color: #666;
        }

        .references ul {
            padding-left: 20px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            .post-title {
                font-size: 36px;
            }

            .back-link {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navigation">
            <a href="/blog.html" class="back-link">← Blog</a>
        </nav>

        <div class="post-header">
            <h3 class="post-title">{{ page.title }}</h3>
            <div class="post-author">{{ page.author | default: site.author }}</div>
            <div class="post-date">{{ page.date | date: "%B %-d, %Y" }}</div>
        </div>

        <div class="post-content">
            {{ content }}
        </div>
    </div>
</body>
</html>
