---
layout: default
---
<section class="page">
    <article>
        <header class="entry-header">
            <h1>{{ page.title }}</h1>
            <div class="entry-date">{{ page.date | date: "%B %-d, %Y" }}</div>
            {% if page.authors %}
            <div class="entry-authors">By {{ page.authors | array_to_sentence_string }}</div>
            {% endif %}
        </header>

        <div class="post-content">
            {{ content }}
        </div>
    </article>
    <p class="back"><a href="/blog.html">&larr; Back</a></p>
</section>
