<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ site.url }}/feed.xml">
    <script>
        (function () {
            var stored = localStorage.getItem('theme');
            var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root {
            --bg: #fff;
            --text: #222;
            --text-strong: #111;
            --muted: #666;
            --link: #0366d6;
            --border: #ddd;
            --note-bg: #f8f9fa;
        }

        :root[data-theme="dark"] {
            --bg: #16181d;
            --text: #dcdcdc;
            --text-strong: #f2f2f2;
            --muted: #999;
            --link: #6ea8fe;
            --border: #333;
            --note-bg: #1e2228;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Verdana, Geneva, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 60px 20px 80px;
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
            background-color: var(--bg);
        }

        a {
            color: var(--link);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Header / nav, shared across every page */
        .site-header {
            margin-bottom: 40px;
        }

        .site-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-name {
            font-size: 1.6em;
            font-weight: bold;
            margin: 0 0 12px 0;
        }

        .site-name a {
            color: var(--text-strong);
        }

        .site-name a:hover {
            text-decoration: none;
        }

        .theme-toggle {
            background: none;
            border: none;
            padding: 0;
            margin-bottom: 12px;
            color: var(--link);
            cursor: pointer;
            line-height: 0;
        }

        .theme-toggle .icon-sun {
            display: none;
        }

        :root[data-theme="dark"] .theme-toggle .icon-moon {
            display: none;
        }

        :root[data-theme="dark"] .theme-toggle .icon-sun {
            display: inline;
        }

        .site-nav a {
            margin-right: 14px;
            font-size: 14px;
        }

        .site-nav a:last-child {
            margin-right: 0;
        }

        h2 {
            font-size: 1.25em;
            margin-top: 40px;
            margin-bottom: 15px;
        }

        h3 {
            font-size: 1.05em;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        p {
            margin: 0 0 16px 0;
        }

        ul {
            padding-left: 20px;
            margin-bottom: 16px;
        }

        li {
            margin-bottom: 12px;
        }

        /* Homepage */
        .intro {
            position: relative;
            margin-bottom: 20px;
        }

        .intro .profile-img {
            position: absolute;
            top: 0;
            right: 100%;
            margin-right: 24px;
        }

        img.profile-img {
            width: 300px;
            border-radius: 4px;
        }

        /* Not enough room in the left margin for the photo on narrower windows */
        @media (max-width: 1400px) {
            .intro .profile-img {
                position: static;
                margin: 0 0 20px 0;
            }
        }

        .publication-title {
            font-style: italic;
        }

        .highlight {
            font-weight: bold;
        }

        .note {
            font-size: 0.9em;
            color: var(--muted);
        }

        /* Teaching / syllabus page */
        .course-info {
            font-size: 1.02em;
            color: var(--muted);
            margin-top: 6px;
            margin-bottom: 30px;
        }

        .week-section {
            margin-top: 35px;
            padding-top: 15px;
        }

        .week-title {
            font-size: 1.05em;
            font-weight: bold;
            color: var(--text-strong);
            margin-bottom: 12px;
        }

        .reading-list li {
            margin-bottom: 10px;
        }

        .prereq-note {
            background-color: var(--note-bg);
            padding: 15px 20px;
            border-left: 4px solid var(--link);
            margin: 25px 0;
        }

        /* Blog index */
        .page-title {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .posts-list {
            display: grid;
            grid-template-columns: auto 1fr;
            column-gap: 24px;
            row-gap: 12px;
            align-items: baseline;
        }

        .post-date {
            color: var(--muted);
            font-style: italic;
            font-size: 14px;
            white-space: nowrap;
        }

        .post-title a {
            font-size: 15px;
        }

        @media (max-width: 500px) {
            .posts-list {
                grid-template-columns: 1fr;
                row-gap: 4px;
            }

            .post-date {
                margin-top: 10px;
            }
        }

        /* Individual post page */
        .entry-header {
            margin-bottom: 35px;
        }

        .entry-title {
            font-size: 1.7em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .entry-date {
            color: var(--muted);
            font-size: 14px;
        }

        .post-content sup {
            font-size: 12px;
            line-height: 0;
        }

        .post-content sup a.footnote {
            color: var(--link);
        }

        .footnotes {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .footnotes ol {
            padding-left: 20px;
        }

        .footnotes li {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .footnotes li p {
            display: inline;
            margin-bottom: 0;
        }

        .footnotes a.reversefootnote {
            margin-left: 4px;
        }

        .references {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--muted);
        }

        .references ul {
            padding-left: 20px;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 16px 60px;
            }
        }
    </style>
</head>
<body>
    {% include header.html %}
    <main>
        {{ content }}
    </main>
</body>
</html>
