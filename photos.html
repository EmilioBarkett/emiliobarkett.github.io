<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATAGONIA - Photography Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
        }

        /* Main Content */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-title {
            font-size: 48px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            color: #333;
        }

        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .breadcrumb a {
            color: #666;
            text-decoration: underline;
        }

        /* Photo Grid - Masonry Style */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 0;
            grid-auto-rows: 10px;
        }

        .photo-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: all 0.3s ease;
        }

        /* Hover overlay */
        .photo-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(200, 200, 200, 0.4);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .photo-item:hover::before {
            opacity: 1;
        }

        /* Different sizes for masonry effect */
        .photo-item.large {
            grid-row-end: span 50;
        }

        .photo-item.medium {
            grid-row-end: span 35;
        }

        .photo-item.small {
            grid-row-end: span 25;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            position: relative;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            max-width: 90%;
        }

        .modal-image-container {
            position: relative;
            max-width: 100%;
            max-height: 90vh;
        }

        .modal img {
            width: 100%;
            height: auto;
            max-height: 90vh;
            object-fit: contain;
        }

        .modal-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #666;
            text-transform: lowercase;
        }

        .modal-nav a {
            color: #666;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .modal-nav a:hover {
            color: #333;
        }

        .modal-nav a.disabled {
            color: #ccc;
            cursor: not-allowed;
        }

        .close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #666;
            font-size: 30px;
            font-weight: normal;
            cursor: pointer;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .close:hover {
            color: #333;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .section-title {
                font-size: 36px;
                letter-spacing: 2px;
            }

            .photo-grid {
                grid-template-columns: 1fr;
                gap: 2px;
            }

            .photo-item.large {
                grid-row-end: span 40;
            }

            .photo-item.medium {
                grid-row-end: span 30;
            }

            .photo-item.small {
                grid-row-end: span 20;
            }

            .container {
                padding: 20px 10px;
            }
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            background: #f9f9f9;
            transition: border-color 0.3s ease;
        }

        .upload-area:hover {
            border-color: #999;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-btn {
            background: #333;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        .upload-btn:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <!-- Main Content -->
    <div class="container">
        <h1 class="section-title">PATAGONIA</h1>
        <div class="breadcrumb">
            <a href="#">PORTFOLIO</a> > PATAGONIA
        </div>

        <!-- Upload Area -->
        <div class="upload-area">
            <p style="margin-bottom: 20px; color: #666;">Click to upload your photos</p>
            <input type="file" id="fileInput" multiple accept="image/*">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                Choose Photos
            </button>
        </div>

        <!-- Photo Grid -->
        <div class="photo-grid" id="photoGrid">
            <!-- Sample photos with different sizes -->
            <div class="photo-item large" data-index="0">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Rock climbing">
            </div>

            <div class="photo-item medium" data-index="1">
                <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Mountain climbers">
            </div>

            <div class="photo-item large" data-index="2">
                <img src="https://images.unsplash.com/photo-1464822759844-d150baec3fd5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Mountain landscape">
            </div>

            <div class="photo-item small" data-index="3">
                <img src="https://images.unsplash.com/photo-1544966503-7cc5ac882d5f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Portrait">
            </div>

            <div class="photo-item medium" data-index="4">
                <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Mountain peak">
            </div>

            <div class="photo-item large" data-index="5">
                <img src="https://images.unsplash.com/photo-1530549387789-4c1017266635?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Surfing">
            </div>

            <div class="photo-item medium" data-index="6">
                <img src="https://images.unsplash.com/photo-1505142468610-359e7d316be0?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Ocean waves">
            </div>

            <div class="photo-item small" data-index="7">
                <img src="https://images.unsplash.com/photo-1464822759844-d150baec3fd5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Mountain vista">
            </div>
        </div>
    </div>

    <!-- Modal for full-size images -->
    <div id="modal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <div class="modal-image-container">
                <img id="modalImage" src="" alt="">
            </div>
            <div class="modal-nav">
                <a id="prevBtn">prev</a>
                <span>/</span>
                <a id="nextBtn">next</a>
            </div>
        </div>
    </div>

    <script>
        // Modal functionality
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');
        const closeBtn = document.querySelector('.close');
        const photoItems = document.querySelectorAll('.photo-item');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentIndex = 0;
        let allImages = [];

        // Collect all images
        photoItems.forEach((item, index) => {
            const img = item.querySelector('img');
            allImages.push(img.src);
            
            // Add click event to open modal
            item.addEventListener('click', function() {
                currentIndex = index;
                showModal();
            });
        });

        function showModal() {
            modal.style.display = 'block';
            modalImage.src = allImages[currentIndex];
            updateNavButtons();
        }

        function updateNavButtons() {
            prevBtn.classList.toggle('disabled', currentIndex === 0);
            nextBtn.classList.toggle('disabled', currentIndex === allImages.length - 1);
        }

        // Navigation
        prevBtn.addEventListener('click', function() {
            if (currentIndex > 0) {
                currentIndex--;
                modalImage.src = allImages[currentIndex];
                updateNavButtons();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentIndex < allImages.length - 1) {
                currentIndex++;
                modalImage.src = allImages[currentIndex];
                updateNavButtons();
            }
        });

        // Close modal
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        // Close modal when clicking outside the image
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (modal.style.display === 'block') {
                if (e.key === 'Escape') {
                    modal.style.display = 'none';
                } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    currentIndex--;
                    modalImage.src = allImages[currentIndex];
                    updateNavButtons();
                } else if (e.key === 'ArrowRight' && currentIndex < allImages.length - 1) {
                    currentIndex++;
                    modalImage.src = allImages[currentIndex];
                    updateNavButtons();
                }
            }
        });

        // File upload functionality
        const fileInput = document.getElementById('fileInput');
        const photoGrid = document.getElementById('photoGrid');

        fileInput.addEventListener('change', function(e) {
            const files = e.target.files;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        const photoItem = document.createElement('div');
                        const sizes = ['small', 'medium', 'large'];
                        const randomSize = sizes[Math.floor(Math.random() * sizes.length)];
                        photoItem.className = `photo-item ${randomSize}`;
                        photoItem.setAttribute('data-index', allImages.length);
                        
                        photoItem.innerHTML = `<img src="${e.target.result}" alt="Uploaded photo">`;
                        
                        photoGrid.appendChild(photoItem);
                        
                        // Add to images array
                        allImages.push(e.target.result);
                        
                        // Add click event for modal
                        photoItem.addEventListener('click', function() {
                            currentIndex = parseInt(this.getAttribute('data-index'));
                            showModal();
                        });
                    };
                    
                    reader.readAsDataURL(file);
                }
            }
        });

        // Randomize photo sizes on load for variety
        function randomizePhotoSizes() {
            const sizes = ['small', 'medium', 'large'];
            photoItems.forEach(item => {
                const randomSize = sizes[Math.floor(Math.random() * sizes.length)];
                item.className = `photo-item ${randomSize}`;
            });
        }

        // Uncomment the line below if you want random sizes each time
        // randomizePhotoSizes();
    </script>
</body>
</html>
